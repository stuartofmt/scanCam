<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Streams</title>

    <link rel="stylesheet" href="/static/vendor/vuetify.min.css">
    <link rel="stylesheet" href="/static/vendor/mdi.css">
    <link rel="stylesheet" href="/static/index.css">
</head>
<body>

    <div id="app"></div>

    <!-- The page's Vue template; index.js mounts it. Vue and Vuetify are in vendor (see update_vendor.py). -->
    <script type="text/x-template" id="page">
    <v-app>
        <v-app-bar color="primary" density="comfortable" flat>
            <v-app-bar-title>Camera Streams</v-app-bar-title>
        </v-app-bar>

        <v-main>
            <v-container fluid>

                <v-alert v-if="loaded && !names.length && !inUse.length" variant="tonal" icon="mdi-camera-off"
                         text="No cameras detected."></v-alert>

                <v-alert v-if="inUse.length" type="warning" variant="tonal" class="mb-4">
                    <p>The following cameras are in use by another program and cannot be connected to at this time:</p>
                    <ul class="in-use-list">
                        <li v-for="camera in inUse" :key="camera.name">{{ typeLabel(camera.cameratype) }} {{ camera.source }}</li>
                    </ul>
                    <p>Close the other program and restart scanCam to use them.</p>
                </v-alert>

                <!-- Settings on the left, stream on the right, so the effect of a change is visible as it is made.
                     Too narrow for both side by side: stream first, settings below. -->
                <v-row v-show="names.length">

                    <v-col cols="12" md="auto" class="order-last order-md-first">

                        <div class="d-flex align-center ga-4 mb-4">
                            <v-select v-model="selected" :items="names" label="Camera" hide-details
                                      class="camera-select" @update:model-value="showCamera"></v-select>
                            <span class="text-medium-emphasis">{{ selectedCamera ? typeLabel(selectedCamera.cameratype) : "" }}</span>
                        </div>

                        <v-table density="compact" class="settings-table rounded-lg">
                            <thead>
                                <tr>
                                    <th>Setting</th>
                                    <th>Min / Max</th>
                                    <th>Default</th>
                                    <th>Current</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-if="!settings.length">
                                    <td colspan="4" class="text-center text-medium-emphasis">No settings available.</td>
                                </tr>
                                <tr v-for="setting in settings" :key="setting.setting">
                                    <td>{{ setting.setting }}</td>
                                    <td>{{ formatValue(setting.min) }} / {{ formatValue(setting.max) }}</td>
                                    <td>{{ formatValue(setting.default) }}</td>
                                    <td>
                                        <v-select v-if="setting.choices" v-model="values[setting.setting]" :aria-label="setting.setting"
                                                  :items="setting.choices.map(choice => ({title: formatValue(choice), value: choice}))"
                                                  density="compact" variant="outlined" hide-details class="setting-input"
                                                  @update:model-value="selectChanged(setting)"></v-select>
                                        <v-text-field v-else v-model="values[setting.setting]" :aria-label="setting.setting" type="number"
                                                      :step="setting.step === null ? 'any' : setting.step"
                                                      :min="setting.min ?? undefined" :max="setting.max ?? undefined"
                                                      density="compact" variant="outlined" hide-details class="setting-input"
                                                      @update:model-value="numberTyped(setting)"
                                                      @update:focused="isFocused => isFocused ? focused = setting.setting : numberDone(setting)"
                                                      @keydown.enter="numberDone(setting)"></v-text-field>
                                    </td>
                                </tr>
                            </tbody>
                        </v-table>

                        <p :class="['settings-status', 'mt-2', {'text-error': status.error}]" aria-live="polite">{{ status.text }}</p>

                    </v-col>

                    <v-col cols="12" md class="camera-display">
                        <v-card class="pa-3" rounded="lg">
                            <img ref="streamImage" :alt="selected" class="stream">
                            <div class="d-flex flex-column ga-1 mt-3 camera-links">
                                <a :href="streamUrl" target="_blank" rel="noopener noreferrer">Stream: {{ streamUrl }}</a>
                                <a :href="snapshotUrl" target="_blank" rel="noopener noreferrer">Snapshot: {{ snapshotUrl }}</a>
                            </div>
                        </v-card>
                    </v-col>

                </v-row>

            </v-container>
        </v-main>
    </v-app>
    </script>

    <script src="/static/vendor/vue.global.prod.js"></script>
    <script src="/static/vendor/vuetify.min.js"></script>
    <script src="/static/index.js"></script>

</body>
</html>
